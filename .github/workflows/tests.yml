name: Tests

on:
  pull_request:
  push:

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-24.04
    env:
      REQUIRE_LUA_TESTS: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - name: Build Lua 5.1.5 runtime
        timeout-minutes: 3
        run: |
          cd "$RUNNER_TEMP"
          curl --fail --silent --show-error --location --connect-timeout 10 --max-time 30 \
            --retry 2 --retry-all-errors --retry-max-time 60 \
            --output lua-5.1.5.tar.gz https://www.lua.org/ftp/lua-5.1.5.tar.gz
          printf '%s  %s\n' '2640fc56a795f29d28ef15e13c34a47e223960b0240e8cb0a82d9b0738695333' \
            'lua-5.1.5.tar.gz' | sha256sum --check
          tar -xzf lua-5.1.5.tar.gz
          # The generic target builds without readline development headers.
          make -C lua-5.1.5 -j2 generic
          install -Dm755 lua-5.1.5/src/lua "$RUNNER_TEMP/lua-bin/lua5.1"
          "$RUNNER_TEMP/lua-bin/lua5.1" -v
          echo "$RUNNER_TEMP/lua-bin" >> "$GITHUB_PATH"
      - name: Run Python and Lua tests
        run: python -m unittest discover -s tests -v
      - uses: azure/setup-helm@v4
        with:
          version: v3.19.0
      - name: Render pinned platform plugin charts
        run: |
          python -m pip install PyYAML==6.0.3
          python tests/check_platform_charts.py
  routing-errors:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - run: python -m pip install PyYAML==6.0.3
      - name: Check KIC Secret permissions
        run: python tests/check_kic_rbac.py
      - name: Check routing errors with real Kong and Envoy
        run: python tests/check_route_errors.py
