name: Tests

on:
  pull_request:
  push:

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-24.04
    env:
      REQUIRE_LUA_TESTS: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - name: Install Lua runtime
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends lua5.1
      - name: Run Python and Lua tests
        run: python -m unittest discover -s tests -v
      - uses: azure/setup-helm@v4
        with:
          version: v3.19.0
      - name: Render pinned platform plugin charts
        run: |
          python -m pip install PyYAML==6.0.3
          python tests/check_platform_charts.py
