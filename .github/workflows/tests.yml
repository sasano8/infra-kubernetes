name: Tests

on:
  pull_request:
  push:

permissions:
  contents: read

jobs:
  docs:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.14"
          enable-cache: true
      - name: Build MkDocs site and check links
        run: make docs
  tests:
    runs-on: ubuntu-24.04
    env:
      REQUIRE_LUA_TESTS: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - name: Install Lua runtime
        run: |
          sudo apt-get -o Acquire::Retries=5 update
          sudo apt-get -o Acquire::Retries=5 install --yes --no-install-recommends lua5.1
      - name: Run Python and Lua tests
        run: python -m unittest discover -s tests -v
      - uses: azure/setup-helm@v4
        with:
          version: v3.19.0
      - name: Render pinned platform plugin charts
        run: |
          python -m pip install PyYAML==6.0.3
          python tests/check_platform_charts.py
  routing-errors:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - run: python -m pip install PyYAML==6.0.3
      - name: Check KIC Secret permissions
        run: python tests/check_kic_rbac.py
      - name: Check routing errors with real Kong and Envoy
        run: python tests/check_route_errors.py
