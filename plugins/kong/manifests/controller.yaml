apiVersion: v1
kind: ServiceAccount
metadata:
  name: sas47-kong
  namespace: sas47-kong
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: sas47-kong
  labels: {infra.sasano8.dev/owner: sas47}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: sas47-kong
subjects:
  - kind: ServiceAccount
    name: sas47-kong
    namespace: sas47-kong
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: sas47-kong-leader
  namespace: sas47-kong
rules:
  - apiGroups: [coordination.k8s.io]
    resources: [leases]
    verbs: [get, list, watch, create, update, patch, delete]
  - apiGroups: [""]
    resources: [events]
    verbs: [create, patch]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: sas47-kong-leader
  namespace: sas47-kong
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: sas47-kong-leader
subjects:
  - kind: ServiceAccount
    name: sas47-kong
    namespace: sas47-kong
---
apiVersion: networking.k8s.io/v1
kind: IngressClass
metadata:
  name: sas47-kong
  labels: {infra.sasano8.dev/owner: sas47}
spec:
  controller: ingress-controllers.konghq.com/kong
