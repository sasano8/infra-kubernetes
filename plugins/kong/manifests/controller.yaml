apiVersion: v1
kind: ServiceAccount
metadata:
  name: kong-ingress
  namespace: kong-system
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: kong-ingress
  labels: {infra.sasano8.dev/owner: infra-kubernetes}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: kong-ingress
subjects:
  - kind: ServiceAccount
    name: kong-ingress
    namespace: kong-system
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: kong-ingress-leader
  namespace: kong-system
rules:
  - apiGroups: [coordination.k8s.io]
    resources: [leases]
    verbs: [get, list, watch, create, update, patch, delete]
  - apiGroups: [""]
    resources: [events]
    verbs: [create, patch]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: kong-ingress-leader
  namespace: kong-system
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: kong-ingress-leader
subjects:
  - kind: ServiceAccount
    name: kong-ingress
    namespace: kong-system
---
apiVersion: networking.k8s.io/v1
kind: IngressClass
metadata:
  name: kong-ingress
  labels: {infra.sasano8.dev/owner: infra-kubernetes}
spec:
  controller: ingress-controllers.konghq.com/kong
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: kong-ingress-secrets
  namespace: test
  labels: {infra.sasano8.dev/owner: infra-kubernetes}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: kong-ingress-secrets
subjects:
  - kind: ServiceAccount
    name: kong-ingress
    namespace: kong-system
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: kong-ingress-secrets
  namespace: kong-system
  labels: {infra.sasano8.dev/owner: infra-kubernetes}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: kong-ingress-secrets
subjects:
  - kind: ServiceAccount
    name: kong-ingress
    namespace: kong-system
